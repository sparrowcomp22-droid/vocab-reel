<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>VOCAB REEL</title>
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VOCAB REEL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app" id="app">

  <!-- HEADER -->
  <header class="hud">
    <div class="hud-row">
      <div class="hud-logo">VOCAB<span>REEL</span></div>
      <div class="hud-clock" id="hud-clock">00:00:00:00</div>
    </div>
    <div class="perf perf-top" aria-hidden="true"></div>
  </header>

  <!-- HOME VIEW -->
  <main class="view" id="view-home" data-view="home">
    <section class="stats-strip">
      <div class="stat-box">
        <div class="stat-value" id="stat-streak">0</div>
        <div class="stat-label">DAY STREAK 🔥</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="stat-due">0</div>
        <div class="stat-label">DUE TODAY</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">TOTAL CARDS</div>
      </div>
    </section>

    <section class="tag-filter" id="tag-filter">
      <button class="chip active" data-tag="all">ALL</button>
      <button class="chip" data-tag="video">映像制作</button>
      <button class="chip" data-tag="business">ビジネス</button>
      <button class="chip" data-tag="daily">日常会話</button>
      <button class="chip" data-tag="hunting">狩猟</button>
    </section>

    <button class="btn-primary" id="btn-start-review">
      <span class="btn-primary-main">▶ REVIEW SESSION</span>
      <span class="btn-primary-sub" id="btn-review-sub">0 CARDS DUE</span>
    </button>

    <div class="home-actions">
      <button class="btn-secondary" id="btn-manage">📋 カード管理</button>
      <button class="btn-secondary" id="btn-settings">⚙ 設定</button>
    </div>
  </main>

  <!-- REVIEW VIEW -->
  <main class="view hidden" id="view-review" data-view="review">
    <div class="review-progress">
      <div class="review-progress-text" id="review-progress-text">01 / 12</div>
      <div class="review-progress-bar"><div class="review-progress-fill" id="review-progress-fill"></div></div>
    </div>

    <div class="film-frame" id="film-frame">
      <div class="perf perf-side perf-left" aria-hidden="true"></div>
      <div class="perf perf-side perf-right" aria-hidden="true"></div>

      <div class="card" id="review-card">
        <div class="card-tag" id="card-tag">映像制作</div>

        <div class="card-face card-front">
          <div class="card-en" id="card-en">on location</div>
          <div class="card-ipa" id="card-ipa"></div>
          <button class="btn-speak" id="btn-speak-front">🔊 単語を聞く</button>
          <div class="card-hint">タップしてめくる</div>
        </div>

        <div class="card-face card-back hidden" id="card-back">
          <div class="card-ja" id="card-ja"></div>
          <button class="btn-speak" id="btn-speak-back">🔊 単語を聞く</button>

          <div class="example-block">
            <div class="card-example" id="card-example"></div>
            <div class="card-example-ja hidden" id="card-example-ja"></div>
            <button class="btn-speak btn-speak-example" id="btn-speak-example">🔊 例文を聞く</button>
          </div>

          <div class="pronounce-box">
            <label class="pronounce-label" for="pronounce-input">🎤 発音チェック(キーボードのマイクで話す)</label>
            <div class="pronounce-row">
              <input type="text" id="pronounce-input" class="pronounce-input" placeholder="ここをタップしてマイクで発話" lang="en-US" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
              <button class="btn-check" id="btn-check-pronounce">判定</button>
            </div>
            <div class="pronounce-result hidden" id="pronounce-result">
              <div class="pronounce-score-bar"><div class="pronounce-score-fill" id="pronounce-score-fill"></div></div>
              <div class="pronounce-score-text" id="pronounce-score-text"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="review-actions hidden" id="review-actions">
      <button class="btn-forgot" id="btn-forgot">✕ 忘れた</button>
      <button class="btn-remembered" id="btn-remembered">✓ 覚えてた</button>
    </div>

    <button class="btn-text" id="btn-exit-review">← 中断してホームへ</button>
  </main>

  <!-- SESSION COMPLETE VIEW -->
  <main class="view hidden" id="view-complete" data-view="complete">
    <div class="complete-box">
      <div class="complete-title">SESSION COMPLETE</div>
      <div class="complete-timecode" id="complete-timecode">00:00:00:00</div>
      <div class="complete-stats">
        <div><span id="complete-count">0</span> 枚 復習しました</div>
        <div><span id="complete-accuracy">0</span>% 正答率</div>
        <div>🔥 <span id="complete-streak">0</span> 日連続</div>
      </div>
      <button class="btn-primary" id="btn-complete-home">ホームに戻る</button>
    </div>
  </main>

  <!-- MANAGE CARDS VIEW -->
  <main class="view hidden" id="view-manage" data-view="manage">
    <div class="manage-header">
      <button class="btn-text" id="btn-manage-back">← 戻る</button>
      <div class="manage-title">カード管理</div>
      <button class="btn-add" id="btn-add-card">+ 追加</button>
    </div>
    <input type="text" id="manage-search" class="manage-search" placeholder="検索(英語・日本語)">
    <div class="tag-filter" id="manage-tag-filter">
      <button class="chip active" data-tag="all">ALL</button>
      <button class="chip" data-tag="video">映像制作</button>
      <button class="chip" data-tag="business">ビジネス</button>
      <button class="chip" data-tag="daily">日常会話</button>
      <button class="chip" data-tag="hunting">狩猟</button>
    </div>
    <div class="manage-list" id="manage-list"></div>
  </main>

  <!-- EDIT/ADD CARD VIEW -->
  <main class="view hidden" id="view-edit" data-view="edit">
    <div class="manage-header">
      <button class="btn-text" id="btn-edit-cancel">← キャンセル</button>
      <div class="manage-title" id="edit-title">新規カード</div>
      <div style="width:60px"></div>
    </div>
    <form class="edit-form" id="edit-form">
      <label>英語表現<input type="text" id="edit-en" required></label>
      <label>日本語訳<input type="text" id="edit-ja" required></label>
      <label>例文<textarea id="edit-example" rows="2"></textarea></label>
      <label>例文の日本語訳(任意)<textarea id="edit-example-ja" rows="2"></textarea></label>
      <label>発音記号(任意)<input type="text" id="edit-ipa"></label>
      <label>タグ
        <select id="edit-tag">
          <option value="video">映像制作</option>
          <option value="business">ビジネス</option>
          <option value="daily">日常会話</option>
          <option value="hunting">狩猟</option>
        </select>
      </label>
      <div class="edit-form-actions">
        <button type="button" class="btn-danger hidden" id="btn-delete-card">削除</button>
        <button type="submit" class="btn-primary">保存</button>
      </div>
    </form>
  </main>

  <!-- SETTINGS VIEW -->
  <main class="view hidden" id="view-settings" data-view="settings">
    <div class="manage-header">
      <button class="btn-text" id="btn-settings-back">← 戻る</button>
      <div class="manage-title">設定</div>
      <div style="width:60px"></div>
    </div>
    <div class="settings-box">
      <label class="settings-label">発音判定の合格ライン: <span id="threshold-value">75</span>%</label>
      <input type="range" id="threshold-slider" min="50" max="100" step="5" value="75">
      <p class="settings-note">類似度がこの値以上で「合格」と判定されます。あくまで簡易的なテキスト類似度判定です。</p>
    </div>
  </main>

</div>

<script src="js/srs.js"></script>
<script src="js/similarity.js"></script>
<script src="js/tts.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
